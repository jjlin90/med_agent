<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1379" viewBox="0 0 1500 1379" role="img" aria-label="med_agent · Agentic 工具反馈闭环">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4277b2"/></marker></defs>
<rect width="100%" height="100%" fill="#f0f5fb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="90" y="60" font-size="34" font-weight="700" fill="#16375a">med_agent · Agentic 工具反馈闭环</text>
<text x="90" y="103" font-size="20" fill="#475569">单 Deep Agent｜工具参数由模型提出，程序执行明确边界</text><rect x="90" y="145" width="1320" height="130" rx="14" fill="#ffffff" stroke="#b7c9df"/>
<text x="120" y="180" font-size="24" font-weight="700" fill="#16375a">1  进入 agentic</text>
<text x="120" y="215" font-size="20" fill="#334155">安全硬规则先直达；其余输入由 SafetyIntent 双分类；重置本轮状态。</text>
<text x="120" y="245" font-size="20" fill="#334155">首次模型请求指定 assess_information_gaps；用户补充下一条消息后重新开始本轮流程。</text>
<path d="M750 279 v28" stroke="#4277b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="320" width="1320" height="160" rx="14" fill="#ffffff" stroke="#b7c9df"/>
<text x="120" y="355" font-size="24" font-weight="700" fill="#16375a">2  模型请求与 8 个业务工具</text>
<text x="120" y="390" font-size="20" fill="#334155">检索 medical_rag_search；科室 get_department_recommend；文档 read_medical_doc。</text>
<text x="120" y="420" font-size="20" fill="#334155">缺口 assess_information_gaps；清单 build_visit_preparation。</text>
<text x="120" y="450" font-size="20" fill="#334155">计划 create_task_plan / update_task_progress；证据 check_evidence_sufficiency。</text>
<path d="M750 484 v28" stroke="#4277b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="525" width="1320" height="160" rx="14" fill="#ffffff" stroke="#b7c9df"/>
<text x="120" y="560" font-size="24" font-weight="700" fill="#16375a">3  工具结果反馈给 SDK 循环</text>
<text x="120" y="595" font-size="20" fill="#334155">缺口、清单和计划用规则/模板处理，但多数字段仍由模型传参。</text>
<text x="120" y="625" font-size="20" fill="#334155">文件线程标识和检索/证据用到的状态由 InjectedState 注入。</text>
<text x="120" y="655" font-size="20" fill="#334155">计划 done 不证明业务完成；证据 ready 只反映模型子问题的词面覆盖。</text>
<path d="M750 689 v28" stroke="#4277b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="730" width="1320" height="130" rx="14" fill="#ffffff" stroke="#b7c9df"/>
<text x="120" y="765" font-size="24" font-weight="700" fill="#16375a">4  before_model：记账与硬停止</text>
<text x="120" y="800" font-size="20" fill="#334155">一批新 ToolMessage 记 1 次；并行多个调用算一批，失败与拒绝消息也参与。</text>
<text x="120" y="830" font-size="20" fill="#334155">不足 6 批：返回模型请求；达到 6 批：固定收束，不能再让主模型自由总结。</text>
<path d="M750 864 v28" stroke="#4277b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="905" width="1320" height="160" rx="14" fill="#ffffff" stroke="#b7c9df"/>
<text x="120" y="940" font-size="24" font-weight="700" fill="#16375a">5  后续模型请求的条件约束</text>
<text x="120" y="975" font-size="20" fill="#334155">agentic 已有 RAG 消息且无证据检查消息 → 请求指定证据检查工具。</text>
<text x="120" y="1005" font-size="20" fill="#334155">只检查消息名称；检查失败或先检查后检索都可能使该条件不再满足。</text>
<text x="120" y="1035" font-size="20" fill="#334155">模型依据工具反馈继续行动或作答；ready=false 没有强制重检索/等待用户分支。</text>
<path d="M750 1069 v28" stroke="#4277b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="90" y="1110" width="1320" height="130" rx="14" fill="#ffffff" stroke="#b7c9df"/>
<text x="120" y="1145" font-size="24" font-weight="700" fill="#16375a">6  after_agent：收集来源并审核</text>
<text x="120" y="1180" font-size="20" fill="#334155">仅从本轮 RAG 消息提取来源；无引用时按工具名称分支，未验证工具业务成功。</text>
<text x="120" y="1210" font-size="20" fill="#334155">可能覆盖批次收束文案；自由文本来源正则与逐句审核均有漏检/误检边界。</text>
<text x="90" y="1285" font-size="20" fill="#475569">开放 8 个业务工具不意味着每次任务调用全部工具；自定义计划不是独立 Planner/Executor。</text>
<text x="90" y="1317" font-size="20" fill="#475569">已保存开发评估为 8/9 回答判据通过、56% 预期工具覆盖；不代表完整任务或临床验证。</text></g></svg>